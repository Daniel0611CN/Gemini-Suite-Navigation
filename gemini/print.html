<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Preview</title>
  <!-- KaTeX CSS (extension resource) -->
  <link rel="stylesheet" href="lib/katex.min.css" />
  <style>
    /* Base styles: use system fonts to avoid CSP issues */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #ffffff; color: #1f1f1f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.4;
    }
    .wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .export-header h1 {
      font-size: 16pt;
      font-weight: 500;
      color: inherit;
      margin: 0 0 4px 0;
    }
    .export-header .timestamp {
      font-size: 8pt; font-style: italic; opacity: 0.85; margin-bottom: 16px;
    }
    .export-header hr { border: none; border-top: 1px solid rgba(0,0,0,0.15); margin-bottom: 16px; }

    .message-pair { border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
    .message-part { padding: 8px; }
    .message-part.question { background: #f7f7f7; }
    .message-part.answer { background: #ffffff; }

    .speaker-label { font-size: 10pt; font-weight: bold; margin: 0 0 4px 0; }
    .content { font-size: 10pt; word-wrap: break-word; }
    .content * { max-width: 100%; box-sizing: border-box; }
    .content p { margin: 0.5em 0; }
    .content ul, .content ol { padding-left: 25px; margin: 0.5em 0; }
    .content li { margin-bottom: 5px; }
    .content code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Roboto Mono', monospace; font-size: 0.9em; background: rgba(0,0,0,0.06); padding: 2px 4px; border-radius: 3px; }
    .content pre { background: rgba(0,0,0,0.06); padding: 10px 12px; overflow-x: auto; border-radius: 6px; }

    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }

    table { width: 100%; border-collapse: collapse; margin: 1em 0; page-break-inside: auto; }
    th, td { border: 1px solid rgba(0,0,0,0.15); padding: 8px 10px; text-align: left; }
    th { background: rgba(0,0,0,0.06); }

    /* KaTeX adjustments */
    .katex-display { display: block; text-align: center; margin: 1em 0; page-break-inside: avoid; }
    .katex { font-size: 1.1em; color: inherit; }

    /* Dark theme overrides */
    .theme-dark body { background: #131314; color: #e8eaed; }
    .theme-dark .export-header hr { border-top-color: #282829; }
    .theme-dark .message-pair { border-color: #282829; }
    .theme-dark .message-part.question { background: rgba(255,255,255,0.03); }
    .theme-dark .message-part.answer { background: #131314; }
    .theme-dark a { color: #8ab4f8; }
    .theme-dark th { background: rgba(255,255,255,0.06); }
    .theme-dark .content code, .theme-dark .content pre { background: #202124; }
  </style>
</head>
<body>
  <div class="wrapper" id="root"></div>

  <!-- KaTeX JS and our math processor -->
  <script src="lib/katex.min.js"></script>
  <script src="math_processor.js"></script>
  <script>
    (function() {
      // Notify opener that we are ready
      try { window.opener && window.opener.postMessage({ type: 'PRINT_PAGE_READY' }, '*'); } catch(_) {}

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.classList.add('theme-dark');
        } else {
          document.documentElement.classList.remove('theme-dark');
        }
      }

      function sanitize(html) {
        const div = document.createElement('div');
        div.innerHTML = html || '';
        // Strip noisy elements
        div.querySelectorAll('sources-carousel-inline, sources-carousel, source-footnote').forEach(el => el.remove());
        div.querySelectorAll('[jslog]').forEach(el => el.removeAttribute('jslog'));
        return div.innerHTML;
      }

      function renderConversation(payload) {
        const { theme, title, conversation } = payload || {};
        applyTheme(theme === 'dark' ? 'dark' : 'light');

        const root = document.getElementById('root');
        root.innerHTML = '';
        const header = document.createElement('div');
        header.className = 'export-header';
        header.innerHTML = '<h1></h1><p class="timestamp"></p><hr />';
        header.querySelector('h1').textContent = title || 'Gemini Conversation';
        header.querySelector('.timestamp').textContent = 'Exported on: ' + (new Date().toLocaleString());
        root.appendChild(header);

        const cleanAndMaybeProcess = (html) => {
          let safe = sanitize(html);
          try {
            if (window.mathProcessor && window.mathProcessor.isKaTeXAvailable()) {
              safe = window.mathProcessor.processMathContent(safe);
            }
          } catch (_) {}
          return safe;
        };

        (conversation || []).forEach(item => {
          const pair = document.createElement('div');
          pair.className = 'message-pair';
          if (item.question) {
            const q = document.createElement('div'); q.className = 'message-part question';
            const l = document.createElement('p'); l.className = 'speaker-label'; l.innerHTML = '<strong>User</strong>';
            const c = document.createElement('div'); c.className = 'content'; c.innerHTML = cleanAndMaybeProcess(item.question);
            q.appendChild(l); q.appendChild(c); pair.appendChild(q);
          }
          if (item.answer) {
            const a = document.createElement('div'); a.className = 'message-part answer';
            if (item.question) a.style.borderTop = '1px solid rgba(0,0,0,0.15)';
            const l = document.createElement('p'); l.className = 'speaker-label'; l.innerHTML = '<strong>Gemini</strong>';
            const c = document.createElement('div'); c.className = 'content'; c.innerHTML = cleanAndMaybeProcess(item.answer);
            a.appendChild(l); a.appendChild(c); pair.appendChild(a);
          }
          root.appendChild(pair);
        });

        // Wait for fonts/layout to settle, then print
        setTimeout(() => {
          try {
            window.print();
            // Signal back when printing starts (after a delay), then we can close optionally
            setTimeout(() => {
              try { window.opener && window.opener.postMessage({ type: 'PRINT_DONE' }, '*'); } catch(_) {}
            }, 500);
          } catch (e) {
            try { window.opener && window.opener.postMessage({ type: 'PRINT_ERROR', message: e && e.message }, '*'); } catch(_) {}
          }
        }, 300);
      }

      window.addEventListener('message', (evt) => {
        try {
          if (!evt || !evt.data) return;
          if (evt.data.type === 'PRINT_DATA') {
            renderConversation(evt.data.payload);
          }
        } catch (e) {
          try { window.opener && window.opener.postMessage({ type: 'PRINT_ERROR', message: e && e.message }, '*'); } catch(_) {}
        }
      }, false);

      // Close the window after user finishes print dialog
      window.onafterprint = function() {
        setTimeout(() => { window.close(); }, 200);
      };
    })();
  </script>
</body>
</html>
